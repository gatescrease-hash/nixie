# ADR-0016, ADR-0017: permissive licences only in anything linked into Nixie.
# Run with `cargo deny check licenses`.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "allow"

# LGPL is allowed only per crate, only for native-only crates that are
# dynamically linked and unreachable from the wasm32 build (ADR-0014,
# ADR-0017). Each entry needs a PR that states why. Example:
#
# [[licenses.exceptions]]
# crate = "geos-sys"
# allow = ["LGPL-2.1-only"]
exceptions = []
