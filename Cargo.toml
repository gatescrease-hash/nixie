[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/gatescrease-hash/nixie"
publish = false

# ADR-0012: float comparisons go through named tolerances in `nixie_units::tol`.
[workspace.lints.clippy]
float_cmp = "deny"
